<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Averroes Restaurant - Admin dashboard for menu and orders.">
  <meta name="theme-color" content="#1A1A1A">
  <title>Averroes Restaurant | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/main.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#C9A962',
              cream: '#FDFBF7',
              charcoal: '#1A1A1A',
              muted: '#6B6B6B'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-cream text-zinc-900 font-sans antialiased min-h-screen">

  <!-- Login View -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl border border-zinc-200 shadow-2xl p-8">
      <div class="flex flex-col items-center mb-8">
        <div class="h-16 w-16 rounded-full bg-brand-charcoal flex items-center justify-center border border-brand-gold mb-4">
          <span class="font-serif text-brand-gold font-bold text-3xl">A</span>
        </div>
        <h1 class="font-serif text-2xl font-bold text-zinc-900 text-center">Averroes Restaurant</h1>
        <p class="text-zinc-500 text-sm">Admin Dashboard</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Username</label>
          <input type="text" name="username" value="ave_admin" class="w-full border border-zinc-300 rounded-lg px-4 py-3 text-sm focus:outline-none" required>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Password</label>
          <input type="password" name="password" placeholder="Enter admin password" class="w-full border border-zinc-300 rounded-lg px-4 py-3 text-sm focus:outline-none" required>
        </div>
        <button type="submit" class="w-full bg-zinc-900 text-white font-bold py-3 rounded-lg hover:bg-zinc-800 transition-colors">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Admin App -->
  <div id="admin-app" class="hidden min-h-screen flex flex-col lg:flex-row">
    <!-- Sidebar -->
    <aside class="lg:w-64 bg-white border-r border-zinc-200 flex flex-col">
      <div class="p-5 border-b border-zinc-200">
        <a href="./index.html" class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-full bg-brand-charcoal flex items-center justify-center border border-brand-gold">
            <span class="font-serif text-brand-gold font-bold text-xl">A</span>
          </div>
          <div>
            <p class="font-serif font-bold text-zinc-900 leading-none">Averroes</p>
            <p class="text-[10px] text-zinc-500 uppercase tracking-wider">Admin</p>
          </div>
        </a>
      </div>
      <nav id="admin-sidebar" class="flex-1 p-4 space-y-1 overflow-y-auto">
        <a href="#" data-tab="dashboard" class="admin-sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
        </a>
        <a href="#" data-tab="menu" class="admin-sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-utensils w-5 text-center"></i> Menu
        </a>
        <a href="#" data-tab="orders" class="admin-sidebar-link hidden flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-receipt w-5 text-center"></i> Orders
        </a>
        <a href="#" data-tab="chats" class="admin-sidebar-link hidden flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-comments w-5 text-center"></i> Chats
          <span id="chat-total-badge" class="hidden ml-auto bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[1.25rem] text-center"></span>
        </a>
        <a href="#" data-tab="settings" class="admin-sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-gear w-5 text-center"></i> Settings
        </a>
        <a href="./index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-zinc-700 hover:bg-zinc-50 transition-colors">
          <i class="fa-solid fa-arrow-left w-5 text-center"></i> Customer View
        </a>
      </nav>
      <div class="p-4 border-t border-zinc-200">
        <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-zinc-300 rounded-lg text-sm font-semibold text-zinc-700 hover:border-red-300 hover:text-red-700 hover:bg-red-50 transition-colors">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
      <div id="admin-content" class="max-w-6xl mx-auto">
        <!-- Dynamic tab content -->
      </div>
    </main>
  </div>

  <!-- Modal Mount Point -->
  <div id="meal-modal" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/admin.js"></script>
</body>
</html>
