<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Luxury QR Code digital menu for hotel guests.">
  <meta name="theme-color" content="#1A1A1A">
  <title>Digital Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/main.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#C9A962',
              cream: '#FDFBF7',
              charcoal: '#1A1A1A',
              muted: '#6B6B6B'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-cream text-zinc-900 font-sans antialiased min-h-screen">

  <!-- Sticky Luxury Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-zinc-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-full bg-brand-charcoal flex items-center justify-center border border-brand-gold overflow-hidden shrink-0">
          <img id="site-logo" src="" alt="Logo" class="h-full w-full object-cover hidden">
          <span id="site-logo-fallback" class="font-serif text-brand-gold font-bold text-xl">⋮</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span id="brand-name" class="font-serif text-xl font-bold tracking-tight text-zinc-900 truncate"></span>
          <span id="brand-tagline" class="text-[10px] uppercase tracking-widest text-zinc-500 font-semibold -mt-0.5 truncate"></span>
        </div>
      </a>

    </div>
  </header>

  <!-- Sticky Navigation Bar -->
  <nav class="fixed top-[62px] left-0 right-0 z-40 bg-brand-cream/95 backdrop-blur border-b border-zinc-200/80 py-2.5">
    <div class="max-w-6xl mx-auto px-4 min-w-0">
      <div class="flex items-center gap-1">
        <div id="category-nav" class="flex flex-1 min-w-0 max-w-full gap-2 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-1">
          <!-- Category pills loaded dynamically from database -->
          <div class="skeleton skeleton-pill" style="width:70px"></div>
          <div class="skeleton skeleton-pill" style="width:130px"></div>
          <div class="skeleton skeleton-pill" style="width:110px"></div>
          <div class="skeleton skeleton-pill" style="width:100px"></div>
          <div class="skeleton skeleton-pill" style="width:120px"></div>
        </div>
        <button id="nav-arrow" type="button" class="hidden shrink-0 h-9 w-9 rounded-full border border-zinc-300 bg-white text-brand-gold hover:bg-zinc-50 flex items-center justify-center transition-opacity" aria-label="Scroll right">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Search & Filters -->
  <div id="search-bar" class="fixed top-[108px] left-0 right-0 z-30 bg-brand-cream border-b border-zinc-200/80 py-3">
    <div class="max-w-6xl mx-auto px-4 space-y-3">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </span>
        <input type="text" id="search-input" placeholder="Search dishes, ingredients or categories..." class="w-full bg-white pl-10 pr-9 py-3 text-sm rounded-xl border border-zinc-300 focus:outline-none transition-all" autocomplete="off">
        <button id="clear-search" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-zinc-400 hidden" aria-label="Clear search">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
      <div id="filter-chips" class="flex flex-wrap gap-2">
        <!-- Filter chips injected by JS -->
      </div>
    </div>
  </div>

  <!-- Main Menu -->
  <main id="menu-top" class="max-w-6xl mx-auto px-4 pt-[220px] pb-12">
    <!-- Skeleton loading state (shown while Supabase loads data) -->
    <div id="skeleton-loader">
      <div class="mb-10">
        <div class="skeleton skeleton-text-lg" style="width:180px"></div>
        <div class="skeleton skeleton-text" style="width:260px"></div>
        <div style="height:2px;width:60px;background:var(--brand-gold);margin-top:12px;margin-bottom:16px"></div>
        <div class="space-y-3">
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:70%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:70px;height:28px;border-radius:6px"></div></div></div></div>
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:55%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:65px;height:28px;border-radius:6px"></div></div></div></div>
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:60%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:72px;height:28px;border-radius:6px"></div></div></div></div>
        </div>
      </div>
      <div class="mb-10">
        <div class="skeleton skeleton-text-lg" style="width:200px"></div>
        <div class="skeleton skeleton-text" style="width:240px"></div>
        <div style="height:2px;width:60px;background:var(--brand-gold);margin-top:12px;margin-bottom:16px"></div>
        <div class="space-y-3">
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:65%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:68px;height:28px;border-radius:6px"></div></div></div></div>
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:50%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:75px;height:28px;border-radius:6px"></div></div></div></div>
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:58%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:60px;height:28px;border-radius:6px"></div></div></div></div>
        </div>
      </div>
      <div class="mb-10">
        <div class="skeleton skeleton-text-lg" style="width:150px"></div>
        <div class="skeleton skeleton-text" style="width:220px"></div>
        <div style="height:2px;width:60px;background:var(--brand-gold);margin-top:12px;margin-bottom:16px"></div>
        <div class="space-y-3">
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:75%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:66px;height:28px;border-radius:6px"></div></div></div></div>
          <div class="skeleton-card"><div class="flex items-start gap-4"><div class="skeleton h-24 w-24 rounded-2xl shrink-0"></div><div class="flex-1 pt-2"><div class="skeleton skeleton-text-lg" style="width:45%"></div></div><div class="shrink-0 pt-2"><div class="skeleton" style="width:70px;height:28px;border-radius:6px"></div></div></div></div>
        </div>
      </div>
    </div>

    <!-- Actual menu content (hidden until data loads, then populated by customer.js) -->
    <div id="menu-container" class="animate-fade-in" style="display:none">
      <div id="no-results" class="hidden text-center py-16 bg-white/60 rounded-2xl border border-zinc-200">
        <div class="h-16 w-16 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-utensils text-amber-600 text-2xl"></i></div>
        <h3 class="font-serif font-semibold text-xl text-zinc-800">No dishes found</h3>
        <p class="text-zinc-500 text-sm mt-2 max-w-xs mx-auto">Try adjusting your search or filters to find something delightful.</p>
      </div>
    </div>
  </main>



  <!-- Image Lightbox -->
  <style>
    article[data-id] img { cursor: pointer; }
  </style>
  <div id="image-lightbox" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 opacity-0 pointer-events-none transition-opacity duration-300" aria-modal="true" role="dialog" aria-hidden="true">
    <button id="lightbox-close" class="absolute top-4 right-4 h-11 w-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xl transition-colors" aria-label="Close image">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="lightbox-image" src="" alt="" class="max-w-full max-h-[85vh] w-auto h-auto object-contain rounded-2xl shadow-2xl scale-95 transition-transform duration-300" />
  </div>

  <script>
    (function () {
      const lightbox = document.getElementById('image-lightbox');
      const lightboxImg = document.getElementById('lightbox-image');
      const closeBtn = document.getElementById('lightbox-close');

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.remove('opacity-0', 'pointer-events-none');
        lightbox.setAttribute('aria-hidden', 'false');
        lightboxImg.classList.remove('scale-95');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.add('opacity-0', 'pointer-events-none');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImg.classList.add('scale-95');
        document.body.style.overflow = '';
      }

      document.addEventListener('click', function (e) {
        const img = e.target.closest('article[data-id] img');
        if (img) {
          openLightbox(img.src, img.alt);
        }
      });

      closeBtn.addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', function (e) {
        if (e.target !== lightboxImg) closeLightbox();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !lightbox.classList.contains('opacity-0')) closeLightbox();
      });
    })();
  </script>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-center">
    <div class="bg-white rounded-2xl border border-zinc-200 p-4 shadow-sm">
      <p id="hotel-address" class="text-sm text-zinc-600"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/site-config.js"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/customer.js"></script>
</body>
</html>
